<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🌻 口算塔防</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
            font-family: "Segoe UI", "PingFang SC", "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
            position: fixed;
            top: 0;
            left: 0;
        }
        #gameWrapper {
            position: relative;
            background: #2d4a22;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            max-width: 100%;
            max-height: 100%;
            touch-action: none;
        }
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #4a7c3f;
            cursor: pointer;
            touch-action: none;
        }

        /* ===== 横屏提示（纯CSS控制） ===== */
        #rotateHint {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            color: #fff;
            font-size: 24px;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 999;
            text-align: center;
            padding: 40px;
        }
        #rotateHint .icon {
            font-size: 80px;
            animation: rotatePhone 2s infinite;
        }
        @keyframes rotatePhone {
            0%,
            100% {
                transform: rotate(0deg);
            }
            50% {
                transform: rotate(90deg);
            }
        }
        @media (orientation: portrait) {
            #rotateHint {
                display: flex !important;
            }
        }
        @media (orientation: landscape) {
            #rotateHint {
                display: none !important;
            }
        }

        /* ===== 覆盖层 ===== */
        #overlay,
        #activatorOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 20px;
            text-align: center;
            z-index: 10;
            gap: 6px;
            overflow-y: auto;
            backdrop-filter: blur(6px);
        }
        #overlay {
            background: rgba(0, 0, 0, 0.85);
            display: none;
        }
        #overlay.show {
            display: flex;
        }
        #activatorOverlay {
            background: rgba(0, 0, 0, 0.92);
            z-index: 20;
        }
        #activatorOverlay.hidden {
            display: none;
        }
        #activatorOverlay h2 {
            font-size: clamp(28px, 5vw, 48px);
            color: #f1c40f;
        }
        #overlay h1 {
            font-size: clamp(24px, 5vw, 48px);
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }
        #overlay p,
        #activatorOverlay .sub {
            font-size: clamp(14px, 2vw, 22px);
            opacity: 0.8;
        }
        input,
        select {
            padding: 8px 16px;
            font-size: clamp(16px, 2vw, 24px);
            border: none;
            border-radius: 60px;
            text-align: center;
            background: #f0f0f0;
            color: #222;
            outline: 2px solid #f5b041;
            font-weight: 700;
            font-family: inherit;
            height: 40px;
        }
        input:focus,
        select:focus {
            outline: 4px solid #f39c12;
        }
        #ageInput {
            width: 80px;
        }
        #nameInput {
            width: 200px;
            font-size: 16px;
        }
        #activationInput {
            width: 200px;
            font-size: 16px;
            letter-spacing: 4px;
        }
        #difficultySelect {
            width: 120px;
            background: #2c3e50;
            color: #fff;
            border: 1px solid #f1c40f;
            border-radius: 30px;
            appearance: auto;
        }
        .btn,
        .act-btn {
            padding: 10px 30px;
            font-size: clamp(16px, 2.5vw, 26px);
            border: none;
            border-radius: 40px;
            background: linear-gradient(145deg, #f5b041, #e67e22);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 0 #b85e0e;
            transition: 0.08s;
            font-family: inherit;
            opacity: .5;
            pointer-events: none;
        }
        .btn.active,
        .act-btn {
            opacity: 1;
            pointer-events: auto;
        }
        .btn.active:active,
        .act-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #b85e0e;
        }
        #statusMsg {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, .75);
            color: #f1c40f;
            padding: 4px 16px;
            border-radius: 30px;
            font-size: clamp(14px, 1.8vw, 22px);
            font-weight: 700;
            pointer-events: none;
            opacity: 0;
            transition: opacity .2s;
            z-index: 5;
            border: 2px solid #f1c40f;
            white-space: nowrap;
        }
        #statusMsg.show {
            opacity: 1;
        }

        /* ===== 倒计时：左上角 top:20 left:20 ===== */
        #timeDisplay {
            position: absolute;
            top: 25px;
            left: 120px;
            background: rgba(0, 0, 0, .7);
            color: #f1c40f;
            padding: 4px 14px;
            border-radius: 14px;
            font-size: clamp(10px, 1.2vw, 20px);
            font-weight: 700;
            z-index: 3;
            border: 2px solid #f1c40f;
            letter-spacing: 1px;
        }
        #titleDisplay {
            position: absolute;
            top: 12px;
            right: 20px;
            z-index: 3;
            color: #f1c40f;
            font-size: clamp(14px, 1.6vw, 22px);
            font-weight: 700;
            text-shadow: 0 2px 8px rgba(0, 0, 0, .8);
            background: rgba(0, 0, 0, .4);
            padding: 2px 16px;
            border-radius: 16px;
            border: 1px solid rgba(241, 196, 15, .3);
            white-space: nowrap;
        }
        #skillBtn {
            position: absolute;
            bottom: 12px;
            left: 12px;
            z-index: 4;
            background: linear-gradient(145deg, #e74c3c, #c0392b);
            color: #fff;
            border: 2px solid #f1c40f;
            border-radius: 16px;
            padding: 6px 16px;
            font-size: clamp(14px, 1.6vw, 22px);
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 0 #922b21, 0 0 16px rgba(231, 76, 60, .4);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            font-family: "Segoe UI", "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
        }
        #skillBtn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #922b21;
        }
        #skillBtn .cost {
            font-size: clamp(10px, 1vw, 14px);
            opacity: .8;
        }
        #skillBtn .badge {
            background: rgba(255, 255, 255, .2);
            border-radius: 10px;
            padding: 0 8px;
            font-size: clamp(10px, 1vw, 14px);
        }
        #skillBtn.ready {
            animation: pulse-glow 1s infinite;
            border-color: #f1c40f;
            box-shadow: 0 4px 0 #922b21, 0 0 30px rgba(241, 196, 15, .6);
        }
        #skillBtn.cooldown {
            opacity: .5;
            pointer-events: none;
        }
        @keyframes pulse-glow {
            0%,
            100% {
                box-shadow: 0 4px 0 #922b21, 0 0 16px rgba(241, 196, 15, .3);
            }
            50% {
                box-shadow: 0 4px 0 #922b21, 0 0 40px rgba(241, 196, 15, .7);
            }
        }
        .row-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 8px 20px;
        }
        .row-group .item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .row-group .item label {
            font-size: clamp(14px, 1.6vw, 20px);
            opacity: .9;
        }
        .col-settings {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 4px 12px;
            background: rgba(0, 0, 0, .2);
            padding: 6px 12px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, .08);
            width: 100%;
            max-width: 800px;
        }
        .col-settings label {
            font-size: clamp(12px, 1.2vw, 16px);
            display: flex;
            align-items: center;
            gap: 4px;
            color: #ddd;
        }
        .col-settings select {
            background: #2c3e50;
            color: #fff;
            border: 1px solid #f1c40f;
            border-radius: 8px;
            padding: 2px 6px;
            font-size: clamp(12px, 1.2vw, 16px);
            height: 28px;
            cursor: pointer;
        }
        #wrongAnswerOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, .88);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 30;
            gap: 12px;
            backdrop-filter: blur(4px);
            overflow-y: auto;
        }
        #wrongAnswerOverlay.show {
            display: flex;
        }
        #wrongAnswerOverlay h2 {
            font-size: clamp(24px, 4vw, 40px);
            color: #e74c3c;
        }
        .wrong-list {
            max-height: 60vh;
            overflow-y: auto;
            width: 90%;
            max-width: 700px;
            background: rgba(0, 0, 0, .5);
            border-radius: 16px;
            padding: 16px;
            text-align: left;
        }
        .wrong-item {
            border-bottom: 1px solid rgba(255, 255, 255, .1);
            padding: 8px 0;
            font-size: clamp(14px, 1.6vw, 20px);
        }
        .wrong-item .q {
            color: #f1c40f;
        }
        .wrong-item .a {
            color: #2ecc71;
        }
        .wrong-item .u {
            color: #e74c3c;
        }
        #closeWrongBtn {
            margin-top: 10px;
            padding: 10px 30px;
            font-size: clamp(16px, 2vw, 22px);
            border: none;
            border-radius: 40px;
            background: #f5b041;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }

        /* 手机小屏横屏适配 */
        @media (max-width:600px) and (orientation:landscape) {
            #gameWrapper {
                border-radius: 0;
            }
            #timeDisplay {
                top: 16px;
                left: 16px;
                font-size: clamp(14px, 1.8vw, 20px);
                padding: 2px 10px;
            }
            #titleDisplay {
                top: 10px;
                right: 10px;
                font-size: clamp(10px, 1.2vw, 14px);
                padding: 1px 8px;
            }
            #skillBtn {
                padding: 4px 10px;
                font-size: clamp(10px, 1.4vw, 16px);
                bottom: 6px;
                left: 6px;
            }
            input,
            select {
                font-size: clamp(12px, 1.4vw, 16px);
                height: 30px;
                padding: 4px 8px;
            }
            #overlay h1 {
                font-size: clamp(18px, 3vw, 28px);
            }
            #overlay p {
                font-size: clamp(10px, 1.2vw, 14px);
            }
            #ageInput {
                width: 60px;
            }
            #nameInput {
                width: 120px;
                font-size: 12px;
            }
            #activationInput {
                width: 150px;
                font-size: 12px;
            }
            #difficultySelect {
                width: 90px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <div id="gameWrapper">
        <canvas id="gameCanvas" width="1600" height="900"></canvas>

        <!-- 横屏提示（CSS控制） -->
        <div id="rotateHint">
            <div class="icon">📱</div>
            <p style="margin-top:20px;">请将手机<b>横屏</b>玩游戏</p>
            <p style="font-size:16px; opacity:0.6; margin-top:10px;">转动手机后自动进入</p>
        </div>

        <div id="timeDisplay">⏱️ 10:00</div>
        <div id="titleDisplay">🏫 陈老师原创制作</div>
        <div id="statusMsg">✅ +25 阳光</div>
        <div id="skillBtn" class="cooldown">
            <span>💥</span>
            <span>樱桃炸弹</span>
            <span class="cost">☀️150</span>
            <span class="badge" id="skillBadge">⏳</span>
        </div>

        <!-- 激活码 -->
        <div id="activatorOverlay">
            <h2>🧮 口算塔防</h2>
            <div class="sub">请输入激活码以开始游戏</div>
            <div style="margin:8px 0;font-size:clamp(14px,1.6vw,20px);opacity:.6;">💡 联系作者获取激活码</div>
            <input type="text" id="activationInput" maxlength="8" placeholder="输入激活码">
            <button class="act-btn" id="activationBtn">🔓 激活</button>
            <div class="status-msg" id="activationStatus" style="font-size:clamp(16px,1.8vw,22px);min-height:30px;">等待输入...</div>
            <div style="font-size:clamp(10px,1vw,14px);opacity:.3;">设备ID: <span id="deviceIdDisplay">--</span></div>
        </div>

        <!-- 设置 -->
        <div id="overlay">
            <h1>🧮 口算塔防</h1>
            <p id="overlaySub">答题赚阳光 · 自由列种植 · 生存10分钟</p>
            <div class="row-group">
                <div class="item"><label>👶</label><input type="number" id="ageInput" min="4" max="18" value="8" step="1"></div>
                <div class="item"><label>🏡</label><input type="text" id="nameInput" maxlength="10" value="小明"></div>
                <div class="item"><label>🎯</label>
                    <select id="difficultySelect">
                        <option value="35">简单</option>
                        <option value="25" selected>普通</option>
                        <option value="15">困难</option>
                    </select>
                </div>
            </div>
            <div style="font-size:clamp(12px,1.4vw,18px);opacity:.9;">🌱 设置每列种植的植物（从左到右）</div>
            <div class="col-settings" id="colSettings"></div>
            <button class="btn active" id="startBtn">🌞 开始游戏</button>
            <div style="font-size:clamp(10px,1.1vw,13px);opacity:.5;">答对获得阳光依难度而定 · 答错 -5 ☀️ · 坚持10分钟胜利！</div>
        </div>

        <!-- 错题 -->
        <div id="wrongAnswerOverlay">
            <h2>📝 做错的题目</h2>
            <div class="wrong-list" id="wrongList"></div>
            <button id="closeWrongBtn">关闭</button>
        </div>
    </div>

    <script>
        // ============================================================
        //  口算塔防 - 完整版（横屏CSS控制，倒计时左上角）
        // ============================================================

        // ---------- 常量与配置 ----------
        const API_BASE = '';
        const W = 1600,
            H = 900;
        const ROWS = 5,
            COLS = 7;
        const CW = 150,
            CH = 130;
        const GX = 275,
            GY = 140;
        const HOUSE_X = 60,
            DOOR_W = 18,
            DOOR_H = 22,
            WIN_SZ = 12,
            HOUSE_SZ = 72;
        const EMOJI_FONT = '"Segoe UI","Apple Color Emoji","Segoe UI Emoji",sans-serif';
        const PLANT_TYPES = [
            { id: 'sunflower', name: '向日葵', cost: 50, hp: 100, atk: 0, emoji: '🌻' },
            { id: 'potato', name: '土豆雷', cost: 75, hp: 50, atk: 100, emoji: '💣' },
            { id: 'chomper', name: '食人花', cost: 125, hp: 120, atk: 40, emoji: '🌺' },
            { id: 'icepea', name: '寒冰射手', cost: 150, hp: 100, atk: 15, emoji: '❄️' },
            { id: 'doublepea', name: '双发射手', cost: 200, hp: 120, atk: 20, emoji: '🔫' },
            { id: 'peashooter', name: '豌豆射手', cost: 100, hp: 100, atk: 20, emoji: '🟢' },
            { id: 'wallnut', name: '坚果墙', cost: 50, hp: 400, atk: 0, emoji: '🧱' },
        ];
        const CHERRY = { id: 'cherry', name: '樱桃炸弹', cost: 150, hp: 50, atk: 150, emoji: '🍒' };
        const ZOMBIE_TYPES = [
            { id: 'normal', name: '普通', hp: 100, speed: .35, atk: 8 },
            { id: 'cone', name: '路障', hp: 200, speed: .3, atk: 10 },
            { id: 'bucket', name: '铁桶', hp: 350, speed: .25, atk: 12 },
            { id: 'pole', name: '撑杆', hp: 100, speed: .6, atk: 12 },
            { id: 'newspaper', name: '读报', hp: 150, speed: .45, atk: 15 },
            { id: 'giant', name: '巨人', hp: 500, speed: .18, atk: 25 },
        ];
        const DEFAULT_COLS = ['sunflower', 'potato', 'chomper', 'icepea', 'doublepea', 'peashooter', 'wallnut'];

        // ---------- DOM ----------
        const $ = id => document.getElementById(id);
        const canvas = $('gameCanvas'),
            ctx = canvas.getContext('2d');
        const overlay = $('overlay'),
            activator = $('activatorOverlay');
        const startBtn = $('startBtn'),
            ageInput = $('ageInput'),
            nameInput = $('nameInput'),
            diffSelect = $('difficultySelect');
        const statusMsg = $('statusMsg'),
            timeDisplay = $('timeDisplay'),
            skillBtn = $('skillBtn'),
            skillBadge = $('skillBadge');
        const activationInput = $('activationInput'),
            activationBtn = $('activationBtn'),
            activationStatus = $('activationStatus'),
            deviceDisplay = $('deviceIdDisplay');
        const wrongOverlay = $('wrongAnswerOverlay'),
            wrongList = $('wrongList'),
            closeWrong = $('closeWrongBtn');

        // ---------- 工具 ----------
        const rand = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
        const randF = (a, b) => Math.random() * (b - a) + a;
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

        function getPlant(id) { return PLANT_TYPES.find(p => p.id === id); }

        function getZombie(id) { return ZOMBIE_TYPES.find(z => z.id === id); }

        function cellCenter(r, c) { return { x: GX + c * CW + CW / 2, y: GY + r * CH + CH / 2 }; }

        // ---------- 音效 ----------
        class Sound {
            constructor() { try { this.ctx = new(window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
            resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); }
            play(type) {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator(),
                        gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    const n = this.ctx.currentTime,
                        map = {
                            correct: () => { osc.frequency.setValueAtTime(880, n);
                                osc.frequency.exponentialRampToValueAtTime(1320, n + .12);
                                gain.gain.setValueAtTime(.15, n);
                                gain.gain.exponentialRampToValueAtTime(.001, n + .15);
                                osc.start(n);
                                osc.stop(n + .15); },
                            wrong: () => { osc.frequency.setValueAtTime(330, n);
                                osc.frequency.exponentialRampToValueAtTime(220, n + .2);
                                gain.gain.setValueAtTime(.12, n);
                                gain.gain.exponentialRampToValueAtTime(.001, n + .25);
                                osc.start(n);
                                osc.stop(n + .25); },
                            plant: () => { osc.frequency.setValueAtTime(600, n);
                                osc.frequency.exponentialRampToValueAtTime(900, n + .08);
                                gain.gain.setValueAtTime(.08, n);
                                gain.gain.exponentialRampToValueAtTime(.001, n + .1);
                                osc.start(n);
                                osc.stop(n + .1); },
                            zombie: () => { osc.type = 'sawtooth';
                                osc.frequency.setValueAtTime(200, n);
                                osc.frequency.exponentialRampToValueAtTime(80, n + .3);
                                gain.gain.setValueAtTime(.06, n);
                                gain.gain.exponentialRampToValueAtTime(.001, n + .35);
                                osc.start(n);
                                osc.stop(n + .35); },
                            shoot: () => { osc.frequency.setValueAtTime(1200, n);
                                osc.frequency.exponentialRampToValueAtTime(400, n + .05);
                                gain.gain.setValueAtTime(.04, n);
                                gain.gain.exponentialRampToValueAtTime(.001, n + .06);
                                osc.start(n);
                                osc.stop(n + .06); },
                            zombieDie: () => { osc.type = 'square';
                                osc.frequency.setValueAtTime(300, n);
                                osc.frequency.exponentialRampToValueAtTime(80, n + .2);
                                gain.gain.setValueAtTime(.06, n);
                                gain.gain.exponentialRampToValueAtTime(.001, n + .25);
                                osc.start(n);
                                osc.stop(n + .25); },
                            houseHit: () => { osc.type = 'sawtooth';
                                osc.frequency.setValueAtTime(150, n);
                                osc.frequency.exponentialRampToValueAtTime(50, n + .4);
                                gain.gain.setValueAtTime(.1, n);
                                gain.gain.exponentialRampToValueAtTime(.001, n + .45);
                                osc.start(n);
                                osc.stop(n + .45); },
                            victory: () => { [523, 587, 659, 784, 880, 988, 1175].forEach((f, i) => { const o = this
                                        .ctx.createOscillator(),
                                        g = this.ctx.createGain();
                                        o.connect(g);
                                        g.connect(this.ctx.destination);
                                        o.frequency.setValueAtTime(f, n + i * .1);
                                        g.gain.setValueAtTime(.06, n + i * .1);
                                        g.gain.exponentialRampToValueAtTime(.001, n + i * .1 + .15);
                                        o.start(n + i * .1);
                                        o.stop(n + i * .1 + .15); }); },
                            gameover: () => { [440, 349, 294, 220].forEach((f, i) => { const o = this.ctx
                                        .createOscillator(),
                                        g = this.ctx.createGain();
                                        o.connect(g);
                                        g.connect(this.ctx.destination);
                                        o.type = 'sawtooth';
                                        o.frequency.setValueAtTime(f, n + i * .15);
                                        g.gain.setValueAtTime(.05, n + i * .15);
                                        g.gain.exponentialRampToValueAtTime(.001, n + i * .15 + .2);
                                        o.start(n + i * .15);
                                        o.stop(n + i * .15 + .2); }); },
                            bomb: () => { [80, 120, 180, 240, 300].forEach((f, i) => { const o = this.ctx
                                        .createOscillator(),
                                        g = this.ctx.createGain();
                                        o.connect(g);
                                        g.connect(this.ctx.destination);
                                        o.type = 'sawtooth';
                                        o.frequency.setValueAtTime(f, n + i * .06);
                                        g.gain.setValueAtTime(.12, n + i * .06);
                                        g.gain.exponentialRampToValueAtTime(.001, n + i * .06 + .15);
                                        o.start(n + i * .06);
                                        o.stop(n + i * .06 + .15); }); }
                        };
                    if (map[type]) map[type]();
                } catch (e) {}
            }
        }
        const sound = new Sound();

        // ---------- 激活码 ----------
        let isActivated = false;

        // ---------- 游戏状态 ----------
        let G = {
            running: false,
            age: 8,
            homeName: '我的家园',
            sun: 50,
            score: 0,
            totalTime: 600,

        // ---------- 口算 ----------
        function genQuestion(age) {
            let a, b, op, ans;
            const max = age <= 6 ? 10 : age <= 8 ? 20 : age <= 10 ? 50 : age <= 12 ? 100 : 200;
            const ops = ['+', '-'];
            if (age >= 9) ops.push('×');
            if (age >= 11) ops.push('÷');
            op = ops[rand(0, ops.length - 1)];
            if (op === '+') { a = rand(1, max);
                b = rand(1, max);
                ans = a + b; } else if (op === '-') { a = rand(1, max);
                b = rand(1, max); if (a < b)[a, b] = [b, a];
                ans = a - b; } else if (op === '×') { a = rand(1, Math.min(9, max / 2));
                b = rand(1, Math.min(9, max / 2));
                ans = a * b; } else { b = rand(1, Math.min(9, max / 2));
                const q = rand(1, Math.min(9, max / 2));
                a = b * q;
                ans = q; }
            const opts = [ans];
            for (let i = 0; opts.length < 3; i++) {
                const off = rand(1, Math.max(3, Math.floor(ans * .3) + 1)) * (Math.random() > .5 ? 1 : -1);
                const c = ans + off;
                if (c >= 0 && !opts.includes(c)) opts.push(c);
            }
            while (opts.length < 3) opts.push(ans + opts.length);
            for (let i = opts.length - 1; i > 0; i--) { const j = rand(0, i);
                [opts[i], opts[j]] = [opts[j], opts[i]]; }
            return { text: `${a} ${op} ${b} = ?`, answer: ans, options: opts };
        }

        // ---------- 种植逻辑 ----------
        function getColPlant(c) { return G.colMap[c] || null; }

        function findPos(plantType) {
            const empty = [];
            for (let r = 0; r < ROWS; r++)
                for (let c = 0; c < COLS; c++) {
                    if (!G.plants.some(p => p.row === r && p.col === c && p.hp > 0)) empty.push({ row: r, col: c });
                }
            if (!empty.length) return null;
            const threat = Array(ROWS).fill(0);
            G.zombies.forEach(z => { if (z.hp > 0 && z.row >= 0 && z.row < ROWS) { const d = z.x - GX; if (d > 0 && d <
                        800) threat[z.row] += 20 / (d + 1); } });
            const rows = Array.from({ length: ROWS }, (_, i) => i).sort((a, b) => threat[b] - threat[a]);
            for (const r of rows) {
                if (threat[r] === 0 && threat.some(t => t > 0)) continue;
                const candidates = empty.filter(c => c.row === r).sort((a, b) => a.col - b.col);
                for (const cell of candidates) {
                    if (cell.col < COLS && (getColPlant(cell.col) === plantType)) return cell;
                }
            }
            for (let r = 0; r < ROWS; r++)
                for (let c = 0; c < COLS; c++) {
                    if (empty.some(e => e.row === r && e.col === c) && getColPlant(c) === plantType)
                        return { row: r, col: c };
                }
            return null;
        }

        function autoPlant() {
            if (G.plants.filter(p => p.hp > 0).length >= ROWS * COLS) return;
            const candidates = [];
            for (let c = 0; c < COLS; c++) {
                const pid = getColPlant(c);
                if (!pid) continue;
                const def = getPlant(pid);
                if (!def || G.sun < def.cost || G.plants.filter(p => p.col === c && p.hp > 0).length >= ROWS) continue;
                candidates.push({ col: c, pid });
            }
            if (!candidates.length) return;
            const threat = Array(COLS).fill(0);
            G.zombies.forEach(z => { if (z.hp > 0) { const zc = Math.floor((z.x - GX) / CW); if (zc >= 0 && zc < COLS) { const
                        d = z.x - GX; if (d > 0 && d < 600) threat[zc] += 10 / (d + 1); } } });
            candidates.sort((a, b) => threat[b.col] - threat[a.col]);
            for (const cand of candidates) {
                const def = getPlant(cand.pid);
                if (!def || G.sun < def.cost) continue;
                const pos = findPos(cand.pid);
                if (!pos) continue;
                G.sun -= def.cost;
                const p = cellCenter(pos.row, pos.col);
                const plant = { type: cand.pid, row: pos.row, col: pos.col, x: p.x, y: p.y, hp: def.hp, maxHp: def.hp,
                    atk: def.atk, timer: 0, atkTimer: 0, cooldown: 1.2 };
                if (cand.pid === 'sunflower') plant.timer = 0;
                if (cand.pid === 'potato') plant.cooldown = .5;
                G.plants.push(plant);
                sound.play('plant');
                showStatus(`🌱 种 ${def.emoji} 第${pos.col+1}列`, '#2ecc71');
                return;
            }
        }

        // ---------- 樱桃炸弹 ----------
        function placeCherry(row, col) {
            if (G.sun < CHERRY.cost) { showStatus('❌ 阳光不足！', '#e74c3c'); return false; }
            G.sun -= CHERRY.cost;
            const pos = cellCenter(row, col);
            for (let k = 0; k < 40; k++) G.particles.push({ x: pos.x + randF(-40, 40), y: pos.y + randF(-40, 40),
                color: ['#e74c3c', '#f39c12', '#f1c40f', '#ff6b6b'][rand(0, 3)], life: 30 + rand(0, 25),
                vx: randF(-10, 10), vy: randF(-10, 10), size: randF(6, 18) });
            let killed = 0;
            for (const z of G.zombies) {
                const zc = Math.floor((z.x - GX) / CW);
                if (z.row >= row - 1 && z.row <= row + 1 && zc >= col - 1 && zc <= col + 1) {
                    z.hp -= 150;
                    if (z.hp <= 0) { killed++;
                        sound.play('zombieDie'); }
                }
            }
            G.zombies = G.zombies.filter(z => z.hp > 0);
            for (const p of G.plants) {
                if (p.row >= row - 1 && p.row <= row + 1 && p.col >= col - 1 && p.col <= col + 1) {
                    p.hp -= 75;
                    if (p.hp <= 0) {
                        p.hp = 0;
                        for (let k = 0; k < 8; k++) G.particles.push({ x: p.x + randF(-20, 20), y: p.y + randF(-20,
                                20), color: '#e67e22', life: 20 + rand(0, 15), vx: randF(-4, 4), vy: randF(-4,
                                4), size: randF(4, 10) });
                    }
                }
            }
            G.plants = G.plants.filter(p => p.hp > 0);
            sound.play('bomb');
            showStatus(`💥 消灭 ${killed} 只僵尸`, '#e74c3c');
            return true;
        }

        // ---------- 僵尸 ----------
        function spawnZombie(id, row) {
            const def = getZombie(id);
            if (!def) return;
            const elapsed = G.totalTime - G.remaining;
            const hp = Math.round(def.hp * (1 + elapsed / 600 * .8));
            const speed = def.speed * (1 + elapsed / 600 * .3) * (.9 + Math.random() * .2) * .9;
            const z = {
                type: id,
                row,
                x: W - 40 - Math.random() * 60,
                y: GY + row * CH + CH / 2,
                hp,
                maxHp: hp,
                speed,
                atk: def.atk,
                atkCD: 0,
                state: 'walking',
                stateTimer: 0,
                name: def.name,
                emoji: '🧟'
            };
            if (id === 'pole') { z.state = 'jumping';
                z.stateTimer = .5;
                z.speed = speed * 1.8; }
            if (id === 'newspaper') { z.state = 'raging';
                z.speed = speed * 1.2; }
            G.zombies.push(z);
            sound.play('zombie');
        }

        function spawnRandom() {
            const elapsed = G.totalTime - G.remaining;
            const avail = ['normal'];
            if (elapsed > 30) avail.push('cone');
            if (elapsed > 60) avail.push('bucket');
            if (elapsed > 100) avail.push('pole');
            if (elapsed > 140) avail.push('newspaper');
            if (elapsed > 200) avail.push('giant');
            const weights = [
                [1, 1, 1, 1, 1, 1],
                [1, 1, 1, 2, 2, 1],
                [1, 1, 2, 2, 3, 2],
                [1, 2, 2, 3, 3, 3]
            ];
            const wi = elapsed > 360 ? 3 : elapsed > 240 ? 2 : elapsed > 120 ? 1 : 0;
            const pool = [];
            avail.forEach((id, idx) => { for (let i = 0; i < weights[wi][idx]; i++) pool.push(id); });
            const pick = pool[rand(0, pool.length - 1)] || 'normal';
            spawnZombie(pick, rand(0, ROWS - 1));
        }

        // ---------- 攻击 ----------
        function plantAttack(plant, zombie) {
            if (plant.atk <= 0) return;
            const dx = zombie.x - plant.x,
                dy = zombie.y - plant.y;
            if (Math.sqrt(dx * dx + dy * dy) < 300) {
                const angle = Math.atan2(dy, dx),
                    spd = 4;
                G.projectiles.push({ x: plant.x, y: plant.y - 10, row: plant.row, damage: plant.atk, vx: Math.cos(
                        angle) * spd, vy: Math.sin(angle) * spd, type: plant.type === 'icepea' ? 'ice' : 'normal',
                    life: 120 });
                sound.play('shoot');
            }
        }

        function updateProjectiles() {
            for (let i = G.projectiles.length - 1; i >= 0; i--) {
                const p = G.projectiles[i];
                p.x += p.vx;
                p.y += p.vy;
                if (--p.life <= 0 || p.x > W || p.x < 0 || p.y < 0 || p.y > H) { G.projectiles.splice(i, 1); continue; }
                let hit = false;
                for (const z of G.zombies) {
                    if (z.row === p.row && Math.abs(z.x - p.x) < 35 && Math.abs(z.y - p.y) < 35 && z.hp > 0) {
                        z.hp -= p.damage;
                        if (p.type === 'ice') z.speed = Math.max(.2, z.speed * .7);
                        for (let k = 0; k < 6; k++) G.particles.push({ x: p.x, y: p.y, color: '#f1c40f', life: 20 +
                                rand(0, 20), vx: randF(-3, 3), vy: randF(-3, 3), size: randF(3, 8) });
                        if (z.hp <= 0) sound.play('zombieDie');
                        hit = true;
                        break;
                    }
                }
                if (hit) G.projectiles.splice(i, 1);
            }
        }

        // ---------- 更新 ----------
        function update(dt) {
            if (!G.running || G.gameOver) return;
            G.frame++;
            const elapsed = G.totalTime - G.remaining;

            G.remaining -= dt;
            if (G.remaining <= 0) {
                G.remaining = 0;
                G.victory = true;
                G.gameOver = true;
                G.running = false;
                showStatus('🎉 恭喜你坚持了10分钟！', '#f1c40f');
                sound.play('victory');
                updateTimeDisplay();
                setTimeout(() => endGame(true), 1500);
                return;
            }
            updateTimeDisplay();

            G.sunTimer += dt;
            if (G.sunTimer > 3) { G.sunTimer = 0;
                G.sun += 2; }

            for (const p of G.plants) {
                if (p.type === 'sunflower' && p.hp > 0) {
                    p.timer += dt;
                    if (p.timer > 6) { p.timer = 0;
                        G.sun += 7;
                        showStatus('🌻 +7 阳光', '#f1c40f');
                        sound.play('plant'); }
                }
            }

            if (G.qCooldown > 0) G.qCooldown -= dt;
            else if (!G.question) { G.question = genQuestion(G.age);
                G.qTimer = 8; } else {
                G.qTimer -= dt;
                if (G.qTimer <= 0) {
                    G.wrongQuestions.push({ question: G.question.text, correctAnswer: G.question.answer,
                    userAnswer: '超时' });
                    G.sun = Math.max(0, G.sun - 5);
                    G.wrong++;
                    G.grassGray = true;
                    G.question = null;
                    G.qCooldown = .5;
                    showStatus('⏰ 超时 -5', '#e74c3c');
                    sound.play('wrong');
                }
            }

            if (G.frame % 24 === 0) autoPlant();

            for (const p of G.plants) {
                if (p.hp <= 0 || p.atk <= 0) continue;
                let target = null,
                    minD = 500;
                for (const z of G.zombies) {
                    if (z.row !== p.row || z.hp <= 0) continue;
                    const dx = z.x - p.x;
                    if (dx > 0 && dx < minD) { minD = dx;
                        target = z; }
                }
                if (target) { p.atkTimer += dt; if (p.atkTimer >= p.cooldown) { p.atkTimer = 0;
                        plantAttack(p, target); } }
            }

            const doorRight = HOUSE_X + 12 + DOOR_W;
            for (const z of G.zombies) {
                if (z.hp <= 0) continue;
                if (z.state === 'jumping') { z.stateTimer -= dt;
                    z.x -= z.speed * dt * 60; if (z.stateTimer <= 0) { z.state = 'walking';
                        z.speed *= .6; } continue; }
                if (z.state === 'raging' && z.hp < z.maxHp * .3) z.speed *= 1.3;
                let eating = false;
                for (const p of G.plants) {
                    if (p.row !== z.row || p.hp <= 0) continue;
                    if (Math.abs(z.x - p.x) < 50 && Math.abs(z.y - p.y) < 40) {
                        eating = true;
                        z.atkCD -= dt;
                        if (z.atkCD <= 0) { p.hp -= z.atk * .3;
                            z.atkCD = .8; if (p.hp <= 0) showStatus(`💀 ${p.type}被吃`, '#e74c3c'); }
                        break;
                    }
                }
                if (!eating) { z.x -= z.speed * dt * 60;
                    z.atkCD = 0; }
                if (z.x < doorRight) {
                    G.houseHP--;
                    z.hp = 0;
                    sound.play('houseHit');
                    showStatus(`💔 房子受损 (${G.houseHP})`, '#e74c3c');
                    if (G.houseHP <= 0) { G.gameOver = true;
                        G.running = false;
                        sound.play('gameover');
                        showStatus('💀 游戏结束！', '#e74c3c');
                        setTimeout(() => endGame(false), 1500);
                        return; }
                }
            }

            updateProjectiles();

            const prog = Math.min(elapsed / 600, 1);
            G.spawnInterval = 2.5 - (2.5 - .4) * prog;
            G.zombieTimer += dt;
            if (G.zombieTimer >= G.spawnInterval) {
                G.zombieTimer = 0;
                spawnRandom();
                if (elapsed > 300 && Math.random() < .2) spawnRandom();
                if (elapsed > 450 && Math.random() < .3) spawnRandom();
            }

            G.plants = G.plants.filter(p => p.hp > 0);
            G.zombies = G.zombies.filter(z => z.hp > 0);

            for (let i = G.particles.length - 1; i >= 0; i--) {
                const p = G.particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vx *= .95;
                p.vy *= .95;
                if (--p.life <= 0) G.particles.splice(i, 1);
            }

            if (!G.bombReady) {
                G.bombCooldown -= dt;
                if (G.bombCooldown <= 0) { G.bombReady = true;
                    skillBtn.classList.remove('cooldown');
                    skillBtn.classList.add('ready');
                    skillBadge.textContent = '点击格子放置'; } else { skillBadge.textContent = Math.ceil(G.bombCooldown) +
                        's'; }
            } else {
                skillBtn.classList.remove('cooldown');
                skillBtn.classList.add('ready');
                skillBadge.textContent = G.bombPlacing ? '👆 点击草坪' : '点击格子放置';
            }
            skillBtn.style.opacity = G.sun < CHERRY.cost ? '.5' : '1';
        }

        function updateTimeDisplay() {
            const m = Math.floor(G.remaining / 60),
                s = Math.floor(G.remaining % 60);
            timeDisplay.textContent = `⏱️ ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            timeDisplay.style.borderColor = G.remaining < 60 ? '#e74c3c' : '#f1c40f';
            timeDisplay.style.color = G.remaining < 60 ? '#e74c3c' : '#f1c40f';
        }

        // ---------- 绘制 ----------
        function draw() {
            ctx.clearRect(0, 0, W, H);
            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, '#4a7c3f');
            grad.addColorStop(1, '#2d4a22');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            for (let r = 0; r < ROWS; r++)
                for (let c = 0; c < COLS; c++) {
                    const x = GX + c * CW,
                        y = GY + r * CH;
                    const gray = G.grassGray;
                    ctx.fillStyle = (r + c) % 2 === 0 ? (gray ? '#6b6b6b' : '#5a8f4c') : (gray ? '#555' : '#4a7c3f');
                    ctx.fillRect(x, y, CW, CH);
                    ctx.strokeStyle = 'rgba(0,0,0,.15)';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(x, y, CW, CH);
                    if (G.bombPlacing && G.running) { ctx.fillStyle = 'rgba(255,0,0,.15)';
                        ctx.fillRect(x, y, CW, CH); }
                }

            const hs = HOUSE_SZ,
                hx = HOUSE_X;
            if (G.homeName) {
                const chars = G.homeName.slice(0, 10).split('');
                const sz = 36,
                    sp = 6,
                    sx = hx - 26,
                    sy = GY + 20;
                ctx.save();
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillStyle = '#f1c40f';
                ctx.font = `bold ${sz}px sans-serif`;
                ctx.shadowBlur = 12;
                ctx.shadowColor = 'rgba(0,0,0,.9)';
                chars.forEach((ch, i) => ctx.fillText(ch, sx, sy + i * (sz + sp)));
                ctx.restore();
            }

            for (let r = 0; r < ROWS; r++) {
                const hy = GY + r * CH + (CH - hs) / 2;
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'rgba(0,0,0,.3)';
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(hx, hy, hs, hs);
                ctx.fillStyle = '#A0522D';
                ctx.beginPath();
                ctx.moveTo(hx - 4, hy);
                ctx.lineTo(hx + hs / 2, hy - 14);
                ctx.lineTo(hx + hs + 4, hy);
                ctx.closePath();
                ctx.fill();
                const dx = hx + 12,
                    dy = hy + hs - DOOR_H;
                ctx.fillStyle = '#2c3e50';
                ctx.fillRect(dx, dy, DOOR_W, DOOR_H);
                ctx.fillStyle = '#f1c40f';
                ctx.beginPath();
                ctx.arc(dx + DOOR_W - 4, dy + DOOR_H / 2, 3, 0, 2 * Math.PI);
                ctx.fill();
                const wx1 = hx + 6,
                    wy1 = hy + 10,
                    wx2 = hx + hs - 6 - WIN_SZ,
                    wy2 = hy + 10;
                ctx.fillStyle = '#5dade2';
                ctx.fillRect(wx1, wy1, WIN_SZ, WIN_SZ);
                ctx.fillRect(wx2, wy2, WIN_SZ, WIN_SZ);
                ctx.strokeStyle = '#2c3e50';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(wx1, wy1, WIN_SZ, WIN_SZ);
                ctx.strokeRect(wx2, wy2, WIN_SZ, WIN_SZ);
                ctx.beginPath();
                [
                    [wx1, wy1],
                    [wx2, wy2]
                ].forEach(([wx, wy]) => {
                    ctx.moveTo(wx + WIN_SZ / 2, wy);
                    ctx.lineTo(wx + WIN_SZ / 2, wy + WIN_SZ);
                    ctx.moveTo(wx, wy + WIN_SZ / 2);
                    ctx.lineTo(wx + WIN_SZ, wy + WIN_SZ / 2);
                });
                ctx.stroke();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#fff';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.fillText('❤️' + G.houseHP, hx + hs / 2, hy - 4);
            }
            ctx.shadowBlur = 0;

            for (const p of G.plants) {
                if (p.hp <= 0) continue;
                const def = getPlant(p.type);
                ctx.font = '52px ' + EMOJI_FONT;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowBlur = 12;
                ctx.shadowColor = 'rgba(0,0,0,.4)';
                ctx.fillStyle = '#fff';
                ctx.fillText(def ? def.emoji : '🌱', p.x, p.y - 8);
                ctx.shadowBlur = 0;
                const hp = p.hp / p.maxHp;
                ctx.fillStyle = 'rgba(0,0,0,.6)';
                ctx.fillRect(p.x - 30, p.y - 42, 60, 8);
                ctx.fillStyle = hp > .5 ? '#2ecc71' : hp > .25 ? '#f1c40f' : '#e74c3c';
                ctx.fillRect(p.x - 30, p.y - 42, 60 * hp, 8);
            }

            for (const z of G.zombies) {
                if (z.hp <= 0) continue;
                ctx.font = '56px ' + EMOJI_FONT;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowBlur = 16;
                ctx.shadowColor = 'rgba(0,0,0,.5)';
                ctx.fillStyle = '#fff';
                ctx.fillText('🧟', z.x, z.y - 6);
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ff6b6b';
                ctx.font = 'bold 16px sans-serif';
                ctx.fillText(z.name, z.x, z.y + 40);
                const hp = z.hp / z.maxHp;
                ctx.fillStyle = 'rgba(0,0,0,.7)';
                ctx.fillRect(z.x - 35, z.y - 50, 70, 10);
                ctx.fillStyle = hp > .5 ? '#2ecc71' : hp > .25 ? '#f1c40f' : '#e74c3c';
                ctx.fillRect(z.x - 35, z.y - 50, 70 * hp, 10);
                ctx.fillStyle = '#fff';
                ctx.font = '12px sans-serif';
                ctx.fillText(`${Math.ceil(z.hp)}/${z.maxHp}`, z.x, z.y - 58);
            }

            for (const p of G.projectiles) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
                ctx.fillStyle = p.type === 'ice' ? '#5dade2' : '#27ae60';
                ctx.shadowBlur = 16;
                ctx.shadowColor = p.type === 'ice' ? '#5dade2' : '#27ae60';
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            for (const p of G.particles) {
                ctx.globalAlpha = p.life / 40;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = p.color || '#f1c40f';
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            ctx.fillStyle = 'rgba(0,0,0,.5)';
            ctx.fillRect(0, 0, W, 60);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 26px sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillText(`☀️ ${Math.floor(G.sun)}`, 20, 44);
            ctx.fillText(`❤️ ${G.houseHP}`, 160, 44);
            ctx.fillText(`✅ ${G.correct}`, 430, 44);
            ctx.fillText(`❌ ${G.wrong}`, 530, 44);
            ctx.fillText(`👶 ${G.age}岁`, 680, 44);

            if (G.question && G.running) {
                const q = G.question,
                    cx = W / 2,
                    cy = H / 2 - 20;
                ctx.fillStyle = 'rgba(0,0,0,.3)';
                ctx.shadowBlur = 30;
                ctx.shadowColor = 'rgba(0,0,0,.6)';
                ctx.beginPath();
                ctx.roundRect(cx - 380, cy - 40, 760, 80, 20);
                ctx.fill();
                ctx.shadowBlur = 0;
                // 口算题颜色（白色）
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 64px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(q.text, cx, cy);

                const optY = GY + ROWS * CH - 20,
                    optCX = 875;
                ctx.fillStyle = 'rgba(0,0,0,.4)';
                ctx.shadowBlur = 20;
                ctx.shadowColor = 'rgba(0,0,0,.5)';
                ctx.beginPath();
                ctx.roundRect(optCX - 300, optY - 30, 600, 70, 20);
                ctx.fill();
                ctx.shadowBlur = 0;
                const ow = 160,
                    gap = 30,
                    tw = q.options.length * ow + (q.options.length - 1) * gap,
                    sx = optCX - tw / 2;
                q._buttons = [];
                q.options.forEach((opt, i) => {
                    const ox = sx + i * (ow + gap);
                    ctx.fillStyle = 'rgba(44,62,80,.85)';
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = 'rgba(0,0,0,.3)';
                    ctx.beginPath();
                    ctx.roundRect(ox, optY - 20, ow, 50, 14);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 34px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(opt, ox + ow / 2, optY + 5);
                    q._buttons.push({ x: ox, y: optY - 20, w: ow, h: 50, value: opt });
                });
                const tp = G.qTimer / 8;
                ctx.fillStyle = 'rgba(0,0,0,.3)';
                ctx.fillRect(optCX - 150, optY + 45, 300, 6);
                ctx.fillStyle = tp > .3 ? '#2ecc71' : '#e74c3c';
                ctx.fillRect(optCX - 150, optY + 45, 300 * Math.max(0, tp), 6);
            }

            ctx.fillStyle = 'rgba(0,0,0,.5)';
            ctx.fillRect(W - 300, H - 50, 280, 36);
            ctx.fillStyle = '#f1c40f';
            ctx.font = '18px sans-serif';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            const hints = G.colMap.map(id => { const d = getPlant(id); return d ? d.emoji : '?'; });
            ctx.fillText(`📋 ${hints.join(' ')}`, W - 20, H - 30);
        }

        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (r > w / 2) r = w / 2;
                if (r > h / 2) r = h / 2;
                this.moveTo(x + r, y);
                this.lineTo(x + w - r, y);
                this.quadraticCurveTo(x + w, y, x + w, y + r);
                this.lineTo(x + w, y + h - r);
                this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                this.lineTo(x + r, y + h);
                this.quadraticCurveTo(x, y + h, x, y + h - r);
                this.lineTo(x, y + r);
                this.quadraticCurveTo(x, y, x + r, y);
                return this;
            };
        }

        let statusTimeout;

        function showStatus(msg, color = '#f1c40f') {
            statusMsg.textContent = msg;
            statusMsg.style.color = color;
            statusMsg.style.borderColor = color;
            statusMsg.classList.add('show');
            clearTimeout(statusTimeout);
            statusTimeout = setTimeout(() => statusMsg.classList.remove('show'), 1500);
        }

        function endGame(victory) {
            G.running = false;
            if (G.wrongQuestions.length) showWrongAnswers();
            else showSetup(victory);
        }

        function showWrongAnswers() {
            wrongList.innerHTML = '';
            G.wrongQuestions.forEach(item => {
                const div = document.createElement('div');
                div.className = 'wrong-item';
                div.innerHTML =
                    `<div class="q">题目：${item.question}</div><div class="a">正确答案：${item.correctAnswer}</div><div class="u">你的回答：${item.userAnswer}</div>`;
                wrongList.appendChild(div);
            });
            wrongOverlay.classList.add('show');
        }

        function showSetup(victory) {
            overlay.classList.add('show');
            document.querySelector('#overlay h1').textContent = victory ? '🎉 胜利！' : '💀 失败...';
            document.querySelector('#overlaySub').textContent = (victory ? '你成功生存了10分钟！' : '房子被僵尸攻破了...') +
                ` 答对 ${G.correct} 题 · 答错 ${G.wrong} 题`;
            startBtn.textContent = '🔄 再来一局';
            startBtn.className = 'btn active';
            G.bombPlacing = false;
            skillBtn.classList.remove('ready');
            skillBtn.classList.add('cooldown');
            skillBadge.textContent = '⏳';
        }

        closeWrong.onclick = () => {
            wrongOverlay.classList.remove('show');
            showSetup(G.victory);
        };

        let lastTime = 0;

        function loop(timestamp) {
            const dt = Math.min((timestamp - lastTime) / 1000, .05);
            lastTime = timestamp;
            if (G.running) update(dt);
            draw();
            requestAnimationFrame(loop);
        }

        function startGame() {
            if (!isActivated) { checkActivation(); return; }
            sound.resume();
            G.age = clamp(parseInt(ageInput.value) || 8, 4, 18);
            G.homeName = nameInput.value.trim().slice(0, 10) || '我的家园';
            G.colMap = [];
            for (let i = 0; i < COLS; i++) {
                const sel = document.getElementById(`colSel_${i}`);
                G.colMap.push(sel ? sel.value : DEFAULT_COLS[i]);
            }
            G.sunReward = parseInt(diffSelect.value) || 25;
            G.sun = 50;
            G.score = 0;
            G.remaining = G.totalTime;
            G.houseHP = G.maxHouseHP = 10;
            G.plants = [];
            G.zombies = [];
            G.projectiles = [];
            G.particles = [];
            G.question = null;
            G.qCooldown = 0;
            G.correct = 0;
            G.wrong = 0;
            G.gameOver = false;
            G.victory = false;
            G.running = true;
            G.frame = 0;
            G.bombReady = true;
            G.bombCooldown = 0;
            G.bombPlacing = false;
            G.sunTimer = 0;
            G.zombieTimer = 0;
            G.spawnInterval = 2.5;
            G.wrongQuestions = [];
            G.grassGray = false;

            skillBtn.classList.remove('cooldown');
            skillBtn.classList.add('ready');
            skillBadge.textContent = '点击格子放置';
            updateTimeDisplay();
            overlay.classList.remove('show');
            showStatus('🌞 生存10分钟开始！', '#2ecc71');
        }

        // ---------- 事件 ----------
        startBtn.onclick = startGame;
        ageInput.onchange = function() { this.value = clamp(parseInt(this.value) || 8, 4, 18); };

        skillBtn.onclick = function(e) {
            e.stopPropagation();
            if (!G.running || G.gameOver) return;
            if (!G.bombReady) { showStatus('⏳ 冷却中...', '#e74c3c'); return; }
            if (G.sun < CHERRY.cost) { showStatus('❌ 阳光不足！', '#e74c3c'); return; }
            G.bombPlacing = !G.bombPlacing;
            skillBadge.textContent = G.bombPlacing ? '👆 点击草坪' : '点击格子放置';
            skillBtn.style.borderColor = G.bombPlacing ? '#ff6b6b' : '#f1c40f';
            if (G.bombPlacing) showStatus('💥 点击草坪放置', '#f39c12');
        };

        canvas.addEventListener('pointerdown', function(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const cx = (e.clientX - rect.left) * (W / rect.width);
            const cy = (e.clientY - rect.top) * (H / rect.height);
            handleClick(cx, cy);
        });

        function handleClick(cx, cy) {
            if (G.running && G.question && G.question._buttons) {
                for (const btn of G.question._buttons) {
                    if (cx >= btn.x && cx <= btn.x + btn.w && cy >= btn.y && cy <= btn.y + btn.h) {
                        if (btn.value === G.question.answer) {
                            G.sun += G.sunReward;
                            G.correct++;
                            G.score += 10;
                            G.grassGray = false;
                            sound.play('correct');
                            showStatus(`✅ +${G.sunReward} 阳光`, '#2ecc71');
                        } else {
                            G.wrongQuestions.push({ question: G.question.text, correctAnswer: G.question.answer,
                                userAnswer: btn.value });
                            G.sun = Math.max(0, G.sun - 5);
                            G.wrong++;
                            G.grassGray = true;
                            sound.play('wrong');
                            showStatus('❌ -5 阳光', '#e74c3c');
                        }
                        G.question = null;
                        G.qCooldown = .8;
                        return;
                    }
                }
            }

            if (G.running && !G.gameOver && G.bombPlacing && G.bombReady) {
                const col = Math.floor((cx - GX) / CW);
                const row = Math.floor((cy - GY) / CH);
                if (row >= 0 && row < ROWS && col >= 0 && col < COLS) {
                    if (placeCherry(row, col)) {
                        G.bombReady = false;
                        G.bombCooldown = 5;
                        G.bombPlacing = false;
                        skillBtn.style.borderColor = '#f1c40f';
                        skillBtn.classList.remove('ready');
                        skillBtn.classList.add('cooldown');
                        skillBadge.textContent = '5s';
                        showStatus('⏳ 冷却中 (5s)', '#f1c40f');
                    }
                } else showStatus('❌ 请点击草坪', '#e74c3c');
                return;
            }
            if (G.bombPlacing) {
                G.bombPlacing = false;
                skillBtn.style.borderColor = '#f1c40f';
                skillBadge.textContent = '点击格子放置';
                showStatus('❌ 已取消', '#e74c3c');
            }
        }

        document.onkeydown = e => { if (e.key === 'b' || e.key === 'B') skillBtn.click(); };

        // ---------- 初始化 ----------
        overlay.classList.add('show');
        requestAnimationFrame(loop);
        console.log('🎮 口算塔防 完整版已加载');
    </script>
</body>
</html>
